<div class="form-row">
  <div class="form-field"><label for="contact-name">Your name <span aria-hidden="true">*</span></label><input id="contact-name" name="full_name" autocomplete="name" maxlength="120" required data-trim-required /></div>
  <div class="form-field"><label for="contact-email">Email <span aria-hidden="true">*</span></label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
</div>
<div class="form-field"><label for="contact-message">Your message <span aria-hidden="true">*</span></label><textarea id="contact-message" name="message" rows="7" maxlength="5000" required data-trim-required></textarea></div>
