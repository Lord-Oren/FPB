<div class="form-row">
  <div class="form-field"><label for="join-name">Full name <span aria-hidden="true">*</span></label><input id="join-name" name="full_name" autocomplete="name" maxlength="120" required data-trim-required /></div>
  <div class="form-field"><label for="join-email">Email <span aria-hidden="true">*</span></label><input id="join-email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
</div>
<div class="form-field"><label for="join-phone">Phone <span class="field-optional">(optional)</span></label><input id="join-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" /></div>
<div class="form-field cv-field"><label for="join-file">Your CV, portfolio or a piece of your work <span class="field-optional">(optional)</span></label><p id="file-help" class="field-help">One file: PDF, Word (DOCX), image (JPG, PNG, WebP) or short video (MP4, WebM), up to 10 MB. Bigger than that? Add a link below instead.</p><input id="join-file" name="attachment" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp,.mp4,.webm,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,image/webp,video/mp4,video/webm" aria-describedby="file-help file-feedback" data-cv /><p id="file-feedback" class="field-feedback" role="status" aria-live="polite" data-cv-feedback></p></div>
<div class="form-field"><label for="join-link">Link to your work <span class="field-optional">(optional)</span></label><p id="link-help" class="field-help">A portfolio, a video or a shared folder. It must start with https://</p><input id="join-link" name="portfolioUrl" type="url" inputmode="url" autocomplete="url" placeholder="https://" maxlength="300" pattern="https://.+" aria-describedby="link-help" /></div>
<div class="form-field"><label for="join-message">Why would you like to join us? <span aria-hidden="true">*</span></label><textarea id="join-message" name="message" rows="7" maxlength="5000" required data-trim-required></textarea></div>
