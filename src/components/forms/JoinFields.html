<div class="form-row">
  <div class="form-field"><label for="join-name">Full name <span aria-hidden="true">*</span></label><input id="join-name" name="full_name" autocomplete="name" maxlength="120" required data-trim-required /></div>
  <div class="form-field"><label for="join-email">Email <span aria-hidden="true">*</span></label><input id="join-email" name="email" type="email" autocomplete="email" maxlength="254" required /></div>
</div>
<div class="form-field"><label for="join-phone">Phone <span class="field-optional">(optional)</span></label><input id="join-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" /></div>
<div class="form-field cv-field"><label for="join-cv">Your anything <span aria-hidden="true">*</span></label><p id="cv-help" class="field-help">One PDF, up to 5 MB.</p><input id="join-cv" name="cv" type="file" accept=".pdf,application/pdf" required aria-describedby="cv-help cv-feedback" data-cv /><p id="cv-feedback" class="field-feedback" role="status" aria-live="polite" data-cv-feedback></p></div>
<div class="form-field"><label for="join-message">Why would you like to join us? <span aria-hidden="true">*</span></label><textarea id="join-message" name="message" rows="7" maxlength="5000" required data-trim-required></textarea></div>
