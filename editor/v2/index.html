<!doctype html>
<!-- Pond Desk v2 (owners' console). Front-end: app.js + style.css in this folder; API implementation: editor/backend/api.mjs.
     Without a reachable /api/v2 (e.g. opened by double-click) the app runs in a flagged demonstration mode. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond Desk</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<p class="demo-band" id="demo-band" hidden role="status">Demo mode: the Pond Desk server is not connected yet. You can try everything; nothing is saved.</p>
<div class="app" id="app" data-pane="list">
  <nav class="rail" aria-label="Pond Desk">
    <span class="rail-logo" aria-hidden="true">FPB</span>
    <button type="button" data-space="site" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg><span>The site</span></button>
    <button type="button" data-space="cv"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11l2 2 4-4"/></svg><span>Applications</span><b class="pill" id="pill-cv" hidden></b></button>
    <button type="button" data-space="msg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Messages</span><b class="pill" id="pill-msg" hidden></b></button>
    <button type="button" data-space="set"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span>Settings</span></button>
    <span class="rail-me" id="me" aria-hidden="true"></span>
  </nav>
  <section class="list" id="list" aria-labelledby="list-title">
    <header><h1 id="list-title">The site</h1><input class="search" id="search" type="search" placeholder="Search" aria-label="Search"></header>
    <div class="scroll" id="list-body"></div>
  </section>
  <section class="main" id="main" aria-label="Content" tabindex="-1"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
