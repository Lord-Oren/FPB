name: Application checks
on:
  pull_request:
  push:
    branches: [main, migration/pond-desk]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fpb_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: fpb_test
        ports: ['48432:5432']
        options: >-
          --health-cmd "pg_isready -U fpb_test -d fpb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      POND_TEST_DATABASE_URL: postgresql://fpb_test:local-test-only@127.0.0.1:48432/fpb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm test
      - run: npm run test:public-build
      - run: npm run test:case-studies-build
      - run: FPB_VARIANT=a npm run export:client
      - run: docker build -t fpb-check .
